name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: neon_idle_fixture
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VITE_NEON_AUTH_URL: https://ep-cold-base-ba45cek7.neonauth.c-8.eu-central-1.aws.neon.tech/prospection95/auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/test-idle-mailbox-query.mjs
      - run: git diff --check
      - run: npx --yes netlify-cli build --offline --context production
      - name: Verify deploy contents
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from "node:fs";
          const manifest = JSON.parse(readFileSync(".netlify/functions/manifest.json", "utf8"));
          const functions = manifest.functions.map(entry => entry.name);
          const expected = ["api", "dispatch-outbox", "reading-session", "sync-bobwork", "sync-drafts", "sync-mailboxes", "sync-unified-mailbox", "track-click", "track-open"];
          if (JSON.stringify([...functions].sort()) !== JSON.stringify(expected.sort())) throw new Error("Unexpected function bundle");
          const scripts = readdirSync("dist/assets").filter(name => name.endsWith(".js")).map(name => readFileSync("dist/assets/" + name, "utf8")).join("\n");
          if (!scripts.includes(process.env.VITE_NEON_AUTH_URL)) throw new Error("Production authentication endpoint missing from bundle");
          console.log("Verified functions:", functions.join(", "));
          console.log("Verified production authentication endpoint");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-prebuilt
          include-hidden-files: true
          path: |
            dist/
            .netlify/functions/
            .netlify/edge-functions/
